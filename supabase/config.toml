# Supabase local config (minimal). Full defaults applied by CLI when present.
# https://supabase.com/docs/guides/cli/config

project_id = "oamk-matching-tool"

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ['./seed.sql']

[api]
enabled = true
port = 54321

[auth.rate_limit]
# Browser E2E signs in several fixed roles from the same localhost address.
sign_in_sign_ups = 100
